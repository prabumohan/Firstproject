[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geolookupservice"
version = "0.1.0"
description = "Long-running MaxMind GeoIP lookup HTTP service for other servers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GeoLookupService" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "geoip2>=4.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
geolookupservice = "geolookupservice.app:run"
geolookupservice-update = "geolookupservice.updater:main"

[tool.setuptools.packages.find]
include = ["geolookupservice*"]

[tool.setuptools.package-data]
geolookupservice = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
