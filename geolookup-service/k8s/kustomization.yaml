apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: geolookup
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
# cronjob.yaml is optional (RWO PVC caveat). Apply separately if needed:
#   kubectl apply -f k8s/cronjob.yaml
images:
  - name: geolookupservice
    newName: geolookupservice
    newTag: "0.1.0"
