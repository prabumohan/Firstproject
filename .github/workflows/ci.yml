name: CI

on:
  push:
    paths:
      - "geolookup-service/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "geolookup-service/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geolookup-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest
